<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD de Produtos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>CRUD de Produtos</h1>
  </header>

  <main class="container">
    <section class="card form-card">
      <h2 id="form-title">Cadastrar produto</h2>
      <form id="product-form">
        <input type="hidden" id="product-id" />

        <div class="field">
          <label for="nome">Nome</label>
          <input type="text" id="nome" placeholder="Digite o nome do produto" required />
        </div>

        <div class="field">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" rows="3" placeholder="Digite uma descrição"></textarea>
        </div>

        <div class="row">
          <div class="field">
            <label for="preco">Preço</label>
            <input type="number" id="preco" step="0.01" min="0" placeholder="0.00" required />
          </div>

          <div class="field">
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" min="0" placeholder="0" required />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Salvar produto</button>
          <button type="button" id="cancel-edit-btn" class="btn btn-ghost" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="card list-card">
      <div class="list-header">
        <div>
          <h2>Produtos</h2>
          <p id="product-count" class="muted">0 produto(s) cadastrado(s)</p>
        </div>
        <button id="refresh-btn" class="btn btn-dark">Atualizar</button>
      </div>

      <div id="products-grid" class="products-grid"></div>

      <p id="empty-state" class="muted empty-state" hidden>Nenhum produto cadastrado ainda.</p>
    </section>
  </main>

  <footer class="footer">
    <p>CRUD MongoDB - Node.js</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
